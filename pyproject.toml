[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG: Claude decides when and what to search over your docs, answers with citations."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.1", "fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
